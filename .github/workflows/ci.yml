name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore bbt.sln

      - name: Build
        run: dotnet build bbt.sln -c Release --no-restore

      - name: Test
        run: dotnet test bbt.sln -c Release --no-build

      - name: Pack (smoke)
        run: dotnet pack src/Bbt/Bbt.csproj -c Release --no-build -o artifacts
