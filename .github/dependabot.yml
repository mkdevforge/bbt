version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dotnet-tooling-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "MinVer"
          - "coverlet.collector"
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      codeql-action-major:
        applies-to: "version-updates"
        patterns:
          - "github/codeql-action*"
        update-types:
          - "major"
      codeql-action-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "github/codeql-action*"
        update-types:
          - "minor"
          - "patch"
      github-actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
        update-types:
          - "minor"
          - "patch"
